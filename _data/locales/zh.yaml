series:
  ai-assisted-engineering:
    title: AI 辅助工程系列
    intro: 把 AI 当作真正的协作者来做东西，持续记录从小型网站实验、远程工作流，到一起写作和交付更大的个人软件项目的过程。
  product-engineering:
    title: 产品工程
    intro: 我提供想法、需求和判断，agent 负责写代码。每篇记录讲的都是产品是什么、它如何做出来，而不是我亲手敲了哪些代码。
  swift-series:
    title: Swift 与 SwiftUI 系列
    intro: 一个新的 Swift 系列，围绕实用的 SwiftUI 理解方式、常用组件、状态与数据流，以及开发模式展开。
  networking-infra:
    title: 网络与基础设施系列
    intro: 关于私有网络、自托管基础设施、macOS 上的 Docker 工作流，以及那些影响我如何运行和访问服务的真实排错经历。
  vr-on-macos:
    title: macOS 上的 VR 系列
    intro: 按时间串起我最近在 macOS 上的 VR 实验，结合长文和简短研究笔记，记录 CrossOver、Quest PCVR、OpenXR，以及这套技术栈仍然卡在哪里。
  subspace-builder:
    title: Subspace Builder 系列
    intro: Subspace Builder 完整的已发布开发记录，从首次发布，到塑造这个网站的工具、工作流和功能更新。
  subspace-surfaces:
    title: Subspace 内容形式
    intro: 把网站里的长篇文章、简短随记和时间线更新放在一条阅读路线里，看看不同内容形式如何组合。
site:
  title: Nicholas Clooney
  description: 记录我做出的东西、写下的想法、好奇的问题，以及偶尔折腾过头的工程实践。
