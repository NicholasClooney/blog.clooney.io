<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" role="img" aria-labelledby="t d">
  <title id="t">5 GHz channel map for Vision Pro streaming</title>
  <desc id="d">5 GHz channels 36 to 165 grouped into 80 MHz blocks. 36-48 and 149-161 are non-DFS and recommended. 52-144 are DFS channels that must vacate on radar. 165 is 20 MHz only. Channel 44, or 149 in some regions, is AWDL's social channel and should be the router's primary channel.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#2a313a"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3a4350" stroke-width="3"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #e6edf3; }
    .title { font-size: 17px; font-weight: 650; }
    .sub, .muted { font-size: 13px; fill: #9aa7b4; }
    .small { font-size: 12px; font-weight: 600; }
    .ch { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .chd { font-size: 12px; font-weight: 600; fill: #9aa7b4; }
    .callout { font-size: 13px; font-weight: 600; }
  </style>
  <rect width="760" height="370" rx="16" fill="#161b22"/>
  <text x="28" y="40" class="title">Where to put the router on 5 GHz</text>
  <text x="28" y="62" class="sub">Pick an 80 MHz block outside DFS, then set the primary channel to AWDL's social channel.</text>
